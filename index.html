
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çanakkale 1915</title>
    <meta
      name="description"
      content="1915 Çanakkale Muharebeleri — tur tabanlı stratejik savaş oyunu"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="harita"></canvas>

      <header id="ustbar">
        <div class="marka">
          <span class="marka-ana" id="marka-ana">ÇANAKKALE</span><span class="marka-yil" id="marka-yil">1915</span>
        </div>
        <div class="tarih-blok">
          <div id="tarih" class="tarih">—</div>
          <div id="hava" class="alt">—</div>
        </div>
        <div id="olculer" class="olculer"></div>
        <button id="tur-bitir" class="tur-bitir">
          <span class="tb-ana">TURU BİTİR</span>
          <span class="tb-alt">Boşluk</span>
        </button>
      </header>

      <nav id="modlar" class="modlar"></nav>
      <div id="mod-aciklama" class="mod-aciklama" aria-live="polite"></div>

      <aside id="panel" class="panel" hidden></aside>

      <section id="gunluk" class="gunluk">
        <div class="gunluk-bas">
          <span>GÜNLÜK</span><button id="gunluk-kapat" class="mini">gizle</button>
        </div>
        <div id="gunluk-liste" class="gunluk-liste"></div>
      </section>

      <div id="ipucu" class="ipucu" hidden></div>

      <div id="olay-katman" class="olay-katman" hidden>
        <article class="olay">
          <div id="olay-tarih" class="olay-tarih"></div>
          <h2 id="olay-baslik" class="olay-baslik"></h2>
          <p id="olay-govde" class="olay-govde"></p>
          <div id="olay-secenek" class="olay-secenek"></div>
          <a id="olay-kaynak" class="olay-kaynak" target="_blank" rel="noopener">kaynak</a>
        </article>
      </div>

      <div id="son-katman" class="olay-katman" hidden>
        <article class="olay olay-son">
          <div class="olay-tarih">KAMPANYA SONU</div>
          <h2 id="son-baslik" class="olay-baslik"></h2>
          <p id="son-govde" class="olay-govde"></p>
          <button id="son-yeniden" class="birincil">YENİDEN OYNA</button>
        </article>
      </div>

      <div id="acilis" class="acilis">
        <div class="acilis-sol">
          <div class="acilis-marka">
            <span class="am-ana">CEPHE SEÇ</span>
            <span class="am-alt">Küreyi döndür · bir cepheye tıkla</span>
          </div>

          <div class="savas-sec" id="savas-sec">
            <button class="savas" data-savas="ww1" aria-pressed="true">
              <span class="sv-ad">BİRİNCİ DÜNYA SAVAŞI</span>
              <span class="sv-yil">1914 — 1918</span>
            </button>
            <button class="savas" data-savas="ww2" aria-pressed="false">
              <span class="sv-ad">İKİNCİ DÜNYA SAVAŞI</span>
              <span class="sv-yil">1939 — 1945</span>
            </button>
          </div>

          <div class="cephe-liste" id="cephe-liste"></div>
          <p class="acilis-not" id="acilis-durum">Harita yükleniyor…</p>
        </div>

        <div class="acilis-kure">
          <canvas id="kure"></canvas>
          <div class="kure-ipucu" id="kure-ipucu">
            <span>Sürükle: döndür · Tekerlek: yakınlaştır</span>
          </div>
        </div>

        <aside class="acilis-detay" id="acilis-detay" hidden>
          <div class="ad-tarih" id="ad-tarih"></div>
          <h2 class="ad-ad" id="ad-ad"></h2>
          <p class="ad-ozet" id="ad-ozet"></p>
          <div class="ad-taraf" id="ad-taraf"></div>
          <div class="taraf-sec" id="taraf-sec">
            <button class="taraf" data-taraf="ottoman" disabled>
              <span class="taraf-ad" id="taraf-a-ad">A</span>
            </button>
            <button class="taraf" data-taraf="entente" disabled>
              <span class="taraf-ad" id="taraf-b-ad">B</span>
            </button>
          </div>
          <a class="ad-kaynak" id="ad-kaynak" target="_blank" rel="noopener">kaynak</a>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
